# Mosquitto para claude-agent-display.
# Arrancar:  mosquitto -c broker/mosquitto/mosquitto.conf -v
#
# Sin TLS a proposito: la placa no puede con una handshake TLS (ver CLAUDE.md,
# restriccion 2). Pero SI con usuario y contrasena, porque quien pueda publicar
# en claude/perm/res puede aprobar cualquier permiso de cualquier agente.

listener 1883 0.0.0.0

allow_anonymous false
password_file mosquitto/passwd

persistence true
persistence_location mosquitto/data/
autosave_interval 30

log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Los mensajes retained de estado son pequenos y pocos; sin limite artificial.
max_queued_messages 200
