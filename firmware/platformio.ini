; claude-agent-display — Freenove FNK0114-S (E32R40T)
; ESP32-WROOM-32E, 4.0" 320x480 ST7796, tactil resistivo XPT2046
; Pines: ver ../PINOUT.md. No tocarlos aqui sin actualizar ese fichero.

[env:fnk0114s]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800   ; 921600 falla a traves de dock USB-C (ruido serie); bajar a 115200 si sigue

board_build.f_flash    = 80000000L
board_build.flash_mode = dio
; La particion por defecto deja 1,25 MB de app entre dos ranuras OTA y el
; binario con WiFi ya ocupaba 790 KB. Con LVGL no cabe. Sin OTA: 3 MB de app.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5   ; v6 a proposito: StaticJsonDocument, tamano fijo (CLAUDE.md)

build_flags =
    -DCORE_DEBUG_LEVEL=2

    ; ---- TFT_eSPI: configuracion completa por flags, sin editar User_Setup.h ----
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480

    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH

    ; tactil XPT2046 en el MISMO bus HSPI que el panel
    -DTOUCH_CS=33

    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1

    ; ---- LVGL 9: sin lv_conf.h, solo los flags que nos apartan del default ----
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_USE_OS=0
    ; Pool propio de LVGL: estatico, aislado del heap de WiFi.
    ; 24 KB bastaban con UNA pantalla; con cuatro (lista, detalle, acciones,
    ; permiso) lv_malloc devolvia NULL y LVGL hacia memzero(NULL) -> panic en
    ; el arranque. El buffer de dibujo ya no esta en .bss, asi que hay sitio.
    ; Medido: el pico real son ~24 KB, asi que 24576 quedaba justo en el borde
    ; y reventaba. 65536 arrancaba bien pero dejaba el mayor bloque contiguo en
    ; 71 KB, por debajo del suelo de 80 KB del presupuesto. 40960 da 60% de uso
    ; y devuelve el bloque grande.
    ; Vigilado en cada log periodico: si el uso pasa del 80%, subirlo.
    -DLV_MEM_SIZE=40960
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=2
    -DLV_USE_PERF_MONITOR=0

    ; ---- MQTT: el payload de estado medido son 157 B; 512 da margen ----
    -DMQTT_MAX_PACKET_SIZE=512
    -DMQTT_KEEPALIVE=30
