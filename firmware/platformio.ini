; claude-agent-display — Freenove FNK0114-S (E32R40T)
; ESP32-WROOM-32E, 4.0" 320x480 ST7796, tactil resistivo XPT2046
; Pines: ver ../PINOUT.md. No tocarlos aqui sin actualizar ese fichero.

[env:fnk0114s]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800   ; 921600 falla a traves de dock USB-C (ruido serie); bajar a 115200 si sigue

board_build.f_flash   = 80000000L
board_build.flash_mode = dio

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DCORE_DEBUG_LEVEL=3

    ; ---- TFT_eSPI: configuracion completa por flags, sin editar User_Setup.h ----
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480

    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH

    ; tactil XPT2046 en el MISMO bus HSPI que el panel
    -DTOUCH_CS=33

    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
